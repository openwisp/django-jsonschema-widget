[tox]
envlist =
    py311-django-52
    {py312,py313,py314}-django-{52,60,61}
    py315-django-61

[testenv]
setenv =
    PYTHONPATH = {toxinidir}:{toxinidir}/django_jsonschema_widget
commands = coverage run --source django_jsonschema_widget runtests.py
deps =
    django-52: Django~=5.2.0
    django-60: Django~=6.0.0
    django-61: Django~=6.1.0
    -r{toxinidir}/requirements-test.txt
